---
deployment:
  tasks:
    - export DEPLOYPATH=/home2/cmancomm/erp.cman.com.mx
    - /bin/rsync -a --no-perms --no-owner --no-group --omit-dir-times --exclude='.git/' --exclude='.github/' --exclude='.env' --exclude='storage/' --exclude='public/storage' --exclude='public/storage_backup/' --exclude='vendor/' --exclude='node_modules/' --exclude='.cpanel.yml' ./ "$DEPLOYPATH/"
    - cd "$DEPLOYPATH" && /usr/local/bin/php /home2/cmancomm/bin/composer.phar install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-progress
    - cd "$DEPLOYPATH" && /usr/local/bin/php artisan migrate --force
    - cd "$DEPLOYPATH" && /usr/local/bin/php artisan optimize:clear